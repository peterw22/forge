name: Installer

# Installs the agent as a service on Linux and macOS with install.sh, checks
# the service and removes it.
on:
  push:
    branches: [main]
    paths:
      - install.sh
      - scripts/test-install.sh
      - cmd/pi-go-agent/authorize_device.go
      - .github/workflows/installer.yml
  pull_request:
    paths:
      - install.sh
      - scripts/test-install.sh
      - cmd/pi-go-agent/authorize_device.go
      - .github/workflows/installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A runner has no session of its user, and so no systemd of the user
      # until lingering starts one.
      - name: Start the systemd of the user
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          for _ in $(seq 1 20); do
            [ -S "/run/user/$(id -u)/bus" ] && break
            sleep 1
          done

      - run: scripts/test-install.sh
